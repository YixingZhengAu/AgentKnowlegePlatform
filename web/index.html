<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 内联 favicon:没有它浏览器每次都请求 /favicon.ico 并在控制台留一条 404
         (前端自测要求"控制台无 error",这条 404 会一直挡着视线)。
         这里的两个色值是 UI-STYLE §2 的品牌对(navy + accent);favicon 读不到 CSS 变量,
         是"色值只写在 index.css"的唯一例外。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2300205B'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FFCB02'/%3E%3C/svg%3E"
    />
    <title>Clenergy Knowledge Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
