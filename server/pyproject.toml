[project]
name = "agent-system-server"
version = "0.1.0"
description = "企业知识 Agent 系统 · 后端"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "openai>=3.3.1",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.0",
    "sqlalchemy>=2.0.52",
    "sqlglot>=30.17.0",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# 只有 prompt 常量文件豁免行宽。理由不是"这些行不好排",而是:
# 这些文件里的长行是**被人工评审过的 prompt 正文**(含逐字的 worked example SQL),
# 换行会改动送给模型的字符串本身 —— 那是在动准确率,不是在动格式。
# 名单要尽量短:只有真正带 prompt 正文的模块在里面。
[tool.ruff.lint.per-file-ignores]
"app/services/text2sql/template.py" = ["E501"]
"app/services/text2sql/params.py" = ["E501"]
"app/services/text2sql/rewrite.py" = ["E501"]
"app/services/text2sql/questions.py" = ["E501"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
# 不用给每个 async 测试挂 @pytest.mark.asyncio
asyncio_mode = "auto"
testpaths = ["tests"]
