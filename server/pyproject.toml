[project]
name = "agent-system-server"
version = "0.1.0"
description = "Clenergy 企业知识 Agent 系统 · 后端"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "openai>=3.3.1",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
# 不用给每个 async 测试挂 @pytest.mark.asyncio
asyncio_mode = "auto"
testpaths = ["tests"]
